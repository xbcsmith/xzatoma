# XZatoma Sandbox Demo: Boundary Verification Plan
#
# This plan exercises each enforcement layer of the sandbox: the filesystem
# root boundary, git directory protection, and network blocking. Some steps
# are expected to fail -- the plan is designed to show that the sandbox
# correctly allows permitted operations and blocks forbidden ones.
#
# Expected results:
#   Step 1  - succeed   (write inside root is allowed)
#   Step 2  - denied    (write outside root is blocked by SandboxGuard)
#   Step 3  - denied    (write to .git directory is blocked by protect_git)
#   Step 4  - denied    (ssh is blocked when network_enabled is false)
#   Step 5  - succeed   (summary report inside root)
#
# Usage:
#   xzatoma --config ./config.yaml --storage-path ./tmp/xzatoma.db \
#     run --plan ./plans/sandbox_boundaries.yaml

name: Sandbox Boundary Verification
description: >
  Exercises XZatoma's sandbox enforcement layers. Some steps are intentionally
  expected to fail: the goal is to confirm that the sandbox correctly allows
  permitted operations and blocks forbidden ones. The final step writes a
  summary report to tmp/output/sandbox_report.txt.

steps:
  - name: Write inside sandbox root
    action: >
      Write exactly the following text to tmp/output/inside_root.txt:

        sandbox test: write inside root succeeded

      This path is inside the sandbox filesystem root (the demo working
      directory). The write must succeed. Note whether it succeeded.

  - name: Attempt write outside sandbox root
    action: >
      Attempt to write exactly the following text to the absolute path
      /tmp/xzatoma_sandbox_escape.txt:

        sandbox test: escape attempt

      This path is outside the sandbox filesystem root. The sandbox must
      block this write with a path-denied error. Record the exact error
      message you receive. Do not stop if the write fails; continue to the
      next step.

  - name: Attempt write to git directory
    action: >
      Attempt to write exactly the following text to the path
      .git/sandbox_test.txt:

        sandbox test: git bypass attempt

      Writes to .git directories are forbidden when protect_git is true. The
      sandbox must block this write. Record the exact error message you
      receive. Do not stop if the write fails; continue to the next step.

  - name: Attempt network-blocked terminal command
    action: >
      Run the following terminal command:

        ssh -o BatchMode=yes -o ConnectTimeout=2 localhost echo test

      The sandbox has network_enabled set to false. The ssh program must be
      blocked by the command validator before it is ever executed. Record the
      exact error message you receive. Do not stop if the command is blocked;
      continue to the next step.

  - name: Write sandbox verification report
    action: >
      Write a report to tmp/output/sandbox_report.txt containing the results
      of all previous steps. Use the following format exactly, replacing the
      bracketed fields with the actual outcome or error message from each step:

        Sandbox Boundary Verification Report
        =====================================

        Step 1 - Write inside root     : [result]
        Step 2 - Write outside root    : [result]
        Step 3 - Write to .git dir     : [result]
        Step 4 - SSH command           : [result]

        Sandbox configuration active during this run:
          enabled            : true
          filesystem_root    : (working directory)
          protect_git        : true
          network_enabled    : false
          sandboxed_tools    : terminal=true, file_ops=true, fetch=true
