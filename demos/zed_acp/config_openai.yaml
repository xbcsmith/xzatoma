# Zed ACP demo configuration for OpenAI-compatible provider
# Set OPENAI_API_KEY environment variable before use
#
# New: the Zed chat panel now supports slash commands handled directly by
# xzatoma (no LLM turn required) in addition to the native mode/safety/model
# dropdowns: /tools, /skills, /mcp, /status, /help, /mentions.
provider:
  type: openai
  openai:
    model: "gpt-4o"

agent:
  max_turns: 20
  timeout_seconds: 120

acp:
  stdio:
    persist_sessions: true
    resume_by_workspace: true
    vision_enabled: true
    prompt_queue_capacity: 8
