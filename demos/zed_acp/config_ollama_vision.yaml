# Zed ACP demo configuration for Ollama with vision support
# Requires: ollama pull granite3.2-vision:2b
#
# New: the Zed chat panel now supports slash commands handled directly by
# xzatoma (no LLM turn required) in addition to the native mode/safety/model
# dropdowns: /tools, /skills, /mcp, /status, /help, /mentions.
provider:
  type: ollama
  ollama:
    host: "http://localhost:11434"
    model: "granite3.2-vision:2b"

agent:
  max_turns: 20
  timeout_seconds: 180

acp:
  stdio:
    persist_sessions: true
    resume_by_workspace: true
    vision_enabled: true
    max_image_bytes: 5242880
    allowed_image_mime_types:
      - image/png
      - image/jpeg
      - image/webp
      - image/gif
    allow_image_file_references: true
    allow_remote_image_urls: false
    prompt_queue_capacity: 8
